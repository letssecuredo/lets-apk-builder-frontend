<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Build status — Let-S APK Builder</title>
<link rel="stylesheet" href="assets/style.css" />
<style>
  .step-list { list-style: none; padding: 0; margin: 16px 0; }
  .step {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .step:last-child { border-bottom: none; }
  .step-icon {
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; flex-shrink: 0;
    background: var(--glass-strong); color: var(--muted);
    border: 1px solid var(--border);
  }
  .step.done .step-icon {
    background: rgba(62, 207, 142, 0.15);
    color: var(--success);
    border-color: rgba(62, 207, 142, 0.4);
  }
  .step.active .step-icon {
    background: rgba(245, 165, 36, 0.15);
    color: var(--warning);
    border-color: rgba(245, 165, 36, 0.4);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .step.failed .step-icon {
    background: rgba(255, 92, 122, 0.15);
    color: var(--danger);
    border-color: rgba(255, 92, 122, 0.4);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .step-name { flex: 1; }
  .step.done .step-name { color: var(--text); }
  .step.active .step-name { color: var(--warning); font-weight: 600; }
  .step.pending .step-name { color: var(--muted); }
  .step.failed .step-name { color: var(--danger); font-weight: 600; }
</style>
</head>
<body>
<header class="nav">
  <div class="brand">Let-S <span>APK Builder</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="build.html">Build</a>
    <a href="builds.html">My Builds</a>
    <a href="downloads.html">Downloads</a>
  </nav>
</header>

<main class="container">
  <h1 style="margin-bottom:6px;">Build status</h1>
  <p style="color:var(--muted);margin-top:0;font-size:12px;" id="buildIdLabel">—</p>

  <div class="card">
    <div class="status-bar">
      <span id="statusPill" class="pill queued">queued</span>
      <span class="spinner" id="spinner"></span>
    </div>

    <div class="progress"><div id="progressBar"></div></div>

    <p id="currentStep" style="color:var(--warning);font-size:13px;margin:8px 0;font-weight:600;display:none;">
      ⏳ <span id="currentStepName"></span>
    </p>

    <ul class="step-list" id="stepList"></ul>

    <div id="msg"></div>

    <div id="downloadWrap" style="display:none;margin-top:16px;">
      <a id="downloadBtn" class="btn btn-block" download>⬇ Download APK</a>
    </div>

    <details style="margin-top:16px;">
      <summary style="cursor:pointer;color:var(--muted);font-size:13px;">Build logs</summary>
      <div class="log-box" id="logBox" style="margin-top:10px;"></div>
    </details>
  </div>

  <div style="margin-top:18px;">
    <a href="build.html" class="btn secondary">Build another</a>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
  const id = qs("buildId");
  const statusPill = document.getElementById("statusPill");
  const progressBar = document.getElementById("progressBar");
  const logBox = document.getElementById("logBox");
  const msg = document.getElementById("msg");
  const spinner = document.getElementById("spinner");
  const downloadWrap = document.getElementById("downloadWrap");
  const downloadBtn = document.getElementById("downloadBtn");
  const buildIdLabel = document.getElementById("buildIdLabel");
  const stepList = document.getElementById("stepList");
  const currentStep = document.getElementById("currentStep");
  const currentStepName = document.getElementById("currentStepName");

  // ⚠️ MUST MATCH workflow build-apk.yml STEP_INDEX values
  const STEPS = [
    { index: 1, name: "Received job" },
    { index: 2, name: "Android SDK ready" },
    { index: 3, name: "Configuration loaded" },
    { index: 4, name: "Android project generated" },
    { index: 5, name: "APK compiled with Gradle" },
    { index: 6, name: "APK signed with keystore" },
    { index: 7, name: "Uploaded to GitHub Releases" },
  ];

  const PCT = { queued: 5, building: 50, signing: 75, uploading: 90, completed: 100, failed: 100 };

  if (!id) {
    msg.innerHTML = `<div class="error-box">Missing buildId in URL.</div>`;
  } else {
    buildIdLabel.textContent = `ID: ${id}`;
    renderSteps(0, "queued");
    poll();
  }

  let stopped = false;

  async function poll() {
    if (stopped) return;
    try {
      const b = await api.getBuild(id);
      render(b);
      if (b.status === "completed" || b.status === "failed") { stopped = true; return; }
    } catch (err) {
      msg.innerHTML = `<div class="error-box">${err.message}</div>`;
    }
    setTimeout(poll, 3000);
  }

  function renderSteps(activeIndex, status) {
    stepList.innerHTML = STEPS.map(s => {
      let cls = "pending";

      if (status === "completed") {
        cls = "done";
      } else if (status === "failed") {
        if (s.index < activeIndex) cls = "done";
        else if (s.index === activeIndex) cls = "failed";
        else cls = "pending";
      } else {
        if (s.index < activeIndex) cls = "done";
        else if (s.index === activeIndex) cls = "active";
        else cls = "pending";
      }

      const icon = cls === "done" ? "✓" : cls === "active" ? "●" : cls === "failed" ? "✕" : s.index;
      return `<li class="step ${cls}">
        <span class="step-icon">${icon}</span>
        <span class="step-name">${s.name}</span>
      </li>`;
    }).join("");
  }

  function render(b) {
    statusPill.className = `pill ${b.status}`;
    statusPill.textContent = b.status;
    progressBar.style.width = (PCT[b.status] || 5) + "%";

    const stepIndex = b.stepIndex || 0;

    if (b.status === "completed") {
      renderSteps(STEPS.length, "completed");
      currentStep.style.display = "none";
    } else if (b.status === "failed") {
      renderSteps(stepIndex || 1, "failed");
      currentStep.style.display = "none";
    } else if (stepIndex > 0) {
      renderSteps(stepIndex, "building");
      currentStep.style.display = "block";
      currentStepName.textContent = b.currentStep || "Working...";
    } else {
      renderSteps(0, "queued");
    }

    if (b.logs?.length) logBox.textContent = b.logs.join("\n");

    if (b.status === "completed" && b.apkUrl) {
      spinner.style.display = "none";
      downloadWrap.style.display = "block";
      downloadBtn.href = api.downloadUrl(b.id);
      downloadBtn.setAttribute("download", `${b.config?.appName || "app"}.apk`);
      msg.innerHTML = `<div class="success-box">✅ Build completed. Your APK is ready.</div>`;
    } else if (b.status === "failed") {
      spinner.style.display = "none";
      msg.innerHTML = `<div class="error-box">❌ Build failed: ${b.error || "unknown error"}</div>`;
    } else {
      msg.innerHTML = `<div style="color:var(--muted);font-size:12px;">Auto-refreshing every 3 seconds…</div>`;
    }
  }
</script>
</body>
</html>
