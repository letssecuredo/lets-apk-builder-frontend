<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Build an APK — Let-S APK Builder</title>
<link rel="stylesheet" href="assets/style.css?v=7" />
<style>
  .icon-drop { position:relative; border:2px dashed var(--border); border-radius:12px; padding:20px; text-align:center; background:var(--bg-2); transition:.15s; cursor:pointer; }
  .icon-drop:hover,.icon-drop.dragover { border-color:var(--accent); background:rgba(31,111,235,.06); }
  .icon-drop input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
  .icon-drop .hint { color:var(--muted); font-size:13px; margin:0; pointer-events:none; }
  .icon-drop .hint strong { color:var(--accent-2); }
  .icon-status { margin:8px 0 0; font-size:12px; color:var(--muted); min-height:16px; text-align:center; word-break:break-word; }
  .icon-status.ok { color:var(--success); } .icon-status.err { color:var(--danger); }
  .icon-preview-wrap { display:none; margin-top:12px; text-align:center; }
  .icon-preview-wrap.show { display:block; }
  .icon-preview { width:120px; height:120px; border-radius:24px; background:var(--bg-2); border:2px solid var(--border); object-fit:cover; box-shadow:0 6px 20px rgba(0,0,0,.3); }
  .icon-preview-meta { margin-top:8px; font-size:11px; color:var(--muted); font-family:ui-monospace,monospace; }
  .perm-section { margin-top:22px; }
  .perm-section > label { font-size:13px; color:var(--muted); margin-bottom:10px; display:block; font-weight:600; letter-spacing:.3px; }
  .perm-cat { margin-bottom:18px; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--bg-2); }
  .perm-cat-header { padding:12px 14px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; user-select:none; background:rgba(255,255,255,.02); }
  .perm-cat-header .title { font-size:13px; font-weight:700; color:var(--accent-2); text-transform:uppercase; letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
  .perm-cat-header .count { font-size:11px; color:var(--muted); background:var(--glass-strong); padding:2px 8px; border-radius:999px; }
  .perm-cat-header .chev { color:var(--muted); font-size:12px; transition:transform .2s; }
  .perm-cat.open .perm-cat-header .chev { transform:rotate(90deg); }
  .perm-cat-body { display:none; padding:12px 14px; border-top:1px solid var(--border); }
  .perm-cat.open .perm-cat-body { display:block; }
  .perm-grid { display:grid; grid-template-columns:1fr; gap:8px; }
  @media (min-width:640px) { .perm-grid { grid-template-columns:1fr 1fr; } }
  .perm-item { display:flex; align-items:flex-start; gap:10px; padding:9px 11px; background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:9px; cursor:pointer; transition:border-color .15s,background .15s; user-select:none; }
  .perm-item:hover { border-color:rgba(99,161,255,.4); background:rgba(31,111,235,.04); }
  .perm-item input[type="checkbox"] { margin-top:2px; width:16px; height:16px; flex-shrink:0; }
  .perm-item .perm-text { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .perm-item .perm-name { font-size:13px; font-weight:600; color:var(--text); }
  .perm-item .perm-desc { font-size:11px; color:var(--muted); line-height:1.35; }
  .perm-item.warn .perm-name::after { content:" • prompts user"; color:var(--warning); font-weight:500; font-size:10px; }
  .perm-item.danger .perm-name::after { content:" • sensitive"; color:var(--danger); font-weight:500; font-size:10px; }
  .perm-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .perm-actions button { font-size:11px; padding:6px 10px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; }
  .perm-actions button:hover { color:var(--text); border-color:var(--accent-2); }
</style>
</head>
<body>
<header class="nav">
  <div class="brand">Let-S <span>APK Builder</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="build.html" class="active">Build</a>
    <a href="builds.html">My Builds</a>
    <a href="downloads.html">Downloads</a>
  </nav>
</header>

<main class="container">
  <h1 style="margin-bottom:6px;">New build</h1>
  <p style="color:var(--muted);margin-top:0;">Pick exactly the permissions your app needs.</p>

  <form id="buildForm" class="card" novalidate>
    <div class="grid-2">
      <div><label for="appName">App name</label><input id="appName" name="appName" type="text" placeholder="My App" maxlength="50" required /></div>
      <div><label for="websiteUrl">Website URL</label><input id="websiteUrl" name="websiteUrl" type="url" placeholder="https://example.com" required /></div>
      <div><label for="packageName">Package name</label><input id="packageName" name="packageName" type="text" value="com.example.myapp" required /></div>
      <div><label for="versionName">Version name</label><input id="versionName" name="versionName" type="text" value="1.0.0" required /></div>
      <div><label for="versionCode">Version code</label><input id="versionCode" name="versionCode" type="number" min="1" value="1" required /></div>
      <div>
        <label for="themeColor">Theme color</label>
        <div style="display:flex;gap:10px;align-items:center;">
          <input id="themeColor" name="themeColor" type="color" value="#1f6feb" />
          <input id="themeColorText" type="text" value="#1f6feb" style="flex:1;" />
        </div>
      </div>
    </div>

    <div style="margin-top:20px;">
      <label for="iconFile">App icon</label>
      <div class="icon-drop" id="iconDrop">
        <input id="iconFile" type="file" accept="image/*" />
        <p class="hint"><strong>Tap to choose</strong> or drag an image here<br><span style="font-size:11px;">PNG · JPG · WebP · GIF → auto-converted to 512×512 PNG</span></p>
      </div>
      <p id="iconStatus" class="icon-status"></p>
      <div id="iconPreviewWrap" class="icon-preview-wrap">
        <img id="iconPreview" class="icon-preview" alt="Icon preview" />
        <div class="icon-preview-meta" id="iconPreviewMeta"></div>
      </div>
    </div>

    <div style="margin-top:16px;">
      <label>Orientation</label>
      <label style="display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px;"><input type="radio" name="orientation" value="portrait" checked /> Portrait</label>
      <label style="display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px;"><input type="radio" name="orientation" value="landscape" /> Landscape</label>
      <label style="display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px;"><input type="radio" name="orientation" value="auto" /> Auto</label>
    </div>

    <div class="perm-section">
      <label>Permissions &amp; features</label>
      <div class="perm-actions">
        <button type="button" onclick="expandAll()">Expand all</button>
        <button type="button" onclick="collapseAll()">Collapse all</button>
        <button type="button" onclick="resetPerms()">Reset</button>
      </div>
      <div id="permContainer" style="margin-top:12px;"></div>
    </div>

    <div id="formError"></div>

    <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;">
      <button type="submit" class="btn" id="submitBtn">Queue build</button>
      <a href="index.html" class="btn ghost">Cancel</a>
    </div>
  </form>
</main>

<script src="assets/app.js?v=7"></script>
<script>
  // ────────────────────────────────────────────────────────────────
  // PERMISSION DEFINITIONS (data-driven UI)
  // ────────────────────────────────────────────────────────────────
  const PERMISSION_CATEGORIES = [
    {
      icon: "🌐", name: "Internet & Network",
      perms: [
        { key: "enableJs", label: "JavaScript", desc: "Required for modern websites", default: true },
        { key: "enableNetworkState", label: "Network state", desc: "Detect if device is online", default: true, manifest: "ACCESS_NETWORK_STATE" },
      ],
    },
    {
      icon: "📷", name: "Media",
      perms: [
        { key: "enableCamera", label: "Camera", desc: "Video calls, QR scan, photo capture", level: "warn", manifest: "CAMERA", runtime: true },
        { key: "enableMicrophone", label: "Microphone", desc: "Voice search, calls, audio recording", level: "warn", manifest: "RECORD_AUDIO", runtime: true },
        { key: "enableAudioSettings", label: "Modify audio settings", desc: "Change volume, audio modes", manifest: "MODIFY_AUDIO_SETTINGS" },
        { key: "enableFileUpload", label: "File upload", desc: "Let users upload files from device", default: true },
      ],
    },
    {
      icon: "📍", name: "Location",
      perms: [
        { key: "enableGeolocation", label: "Precise location", desc: "GPS-based location", level: "warn", manifest: "ACCESS_FINE_LOCATION", runtime: true },
        { key: "enableCoarseLocation", label: "Approximate location", desc: "Network-based location", level: "warn", manifest: "ACCESS_COARSE_LOCATION", runtime: true },
        { key: "enableBackgroundLocation", label: "Background location", desc: "Location even when app is closed", level: "danger", manifest: "ACCESS_BACKGROUND_LOCATION", runtime: true },
      ],
    },
    {
      icon: "💾", name: "Storage",
      perms: [
        { key: "enableReadMediaImages", label: "Read media images", desc: "Access photos (Android 13+)", manifest: "READ_MEDIA_IMAGES", runtime: true },
        { key: "enableReadMediaVideo", label: "Read media video", desc: "Access videos (Android 13+)", manifest: "READ_MEDIA_VIDEO", runtime: true },
        { key: "enableReadMediaAudio", label: "Read media audio", desc: "Access music (Android 13+)", manifest: "READ_MEDIA_AUDIO", runtime: true },
        { key: "enableStorage", label: "External storage (legacy)", desc: "Read/write on Android ≤12", manifest: "READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE", runtime: true },
      ],
    },
    {
      icon: "🔗", name: "Bluetooth & Nearby",
      perms: [
        { key: "enableBluetooth", label: "Bluetooth (modern)", desc: "Scan/connect to BT devices (12+)", level: "warn", manifest: "BLUETOOTH_SCAN,BLUETOOTH_CONNECT,BLUETOOTH_ADVERTISE", runtime: true },
        { key: "enableBluetoothLegacy", label: "Bluetooth (legacy)", desc: "For Android ≤11 devices", manifest: "BLUETOOTH,BLUETOOTH_ADMIN" },
        { key: "enableNfc", label: "NFC", desc: "Read/write NFC tags", manifest: "NFC" },
        { key: "enableNearbyWifi", label: "Nearby WiFi devices", desc: "Discover nearby devices (13+)", level: "warn", manifest: "NEARBY_WIFI_DEVICES", runtime: true },
      ],
    },
    {
      icon: "📶", name: "WiFi & Network Control",
      perms: [
        { key: "enableWifi", label: "Read WiFi state", desc: "View current WiFi info", manifest: "ACCESS_WIFI_STATE" },
        { key: "enableChangeWifi", label: "Change WiFi state", desc: "Enable/disable WiFi", manifest: "CHANGE_WIFI_STATE" },
        { key: "enableChangeNetwork", label: "Change network state", desc: "Enable/disable data", manifest: "CHANGE_NETWORK_STATE" },
      ],
    },
    {
      icon: "📳", name: "Device Features",
      perms: [
        { key: "enableVibration", label: "Vibration", desc: "Haptic feedback on button press", manifest: "VIBRATE" },
        { key: "enableWakeLock", label: "Wake lock", desc: "Keep screen on during video/reading", manifest: "WAKE_LOCK" },
        { key: "enableFlashlight", label: "Flashlight", desc: "Camera LED torch", manifest: "FLASHLIGHT" },
        { key: "enableBodySensors", label: "Body sensors", desc: "Heart rate, step count", level: "warn", manifest: "BODY_SENSORS", runtime: true },
        { key: "enableActivityRecognition", label: "Activity recognition", desc: "Detect walking/driving", level: "warn", manifest: "ACTIVITY_RECOGNITION", runtime: true },
      ],
    },
    {
      icon: "📞", name: "Phone & Contacts",
      perms: [
        { key: "enableReadPhoneState", label: "Read phone state", desc: "Device ID, network info", level: "warn", manifest: "READ_PHONE_STATE", runtime: true },
        { key: "enableCallPhone", label: "Call phone", desc: "Directly call numbers", level: "danger", manifest: "CALL_PHONE", runtime: true },
        { key: "enableReadContacts", label: "Read contacts", desc: "Access contact list", level: "danger", manifest: "READ_CONTACTS", runtime: true },
        { key: "enableWriteContacts", label: "Write contacts", desc: "Modify contact list", level: "danger", manifest: "WRITE_CONTACTS", runtime: true },
        { key: "enableGetAccounts", label: "Get accounts", desc: "Access Google/system accounts", level: "warn", manifest: "GET_ACCOUNTS", runtime: true },
      ],
    },
    {
      icon: "💬", name: "SMS",
      perms: [
        { key: "enableSendSms", label: "Send SMS", desc: "Send text messages", level: "danger", manifest: "SEND_SMS", runtime: true },
        { key: "enableReceiveSms", label: "Receive SMS", desc: "Read incoming messages", level: "danger", manifest: "RECEIVE_SMS", runtime: true },
        { key: "enableReadSms", label: "Read SMS", desc: "Access message history", level: "danger", manifest: "READ_SMS", runtime: true },
      ],
    },
    {
      icon: "📅", name: "Calendar",
      perms: [
        { key: "enableReadCalendar", label: "Read calendar", desc: "View events", level: "warn", manifest: "READ_CALENDAR", runtime: true },
        { key: "enableWriteCalendar", label: "Write calendar", desc: "Create/edit events", level: "warn", manifest: "WRITE_CALENDAR", runtime: true },
      ],
    },
    {
      icon: "🔔", name: "System",
      perms: [
        { key: "enableNotifications", label: "Notifications", desc: "Push / web notifications (13+)", level: "warn", manifest: "POST_NOTIFICATIONS", runtime: true },
        { key: "enableForegroundService", label: "Foreground service", desc: "Long-running tasks with notification", manifest: "FOREGROUND_SERVICE" },
        { key: "enableBootCompleted", label: "Receive boot completed", desc: "Start service on boot", manifest: "RECEIVE_BOOT_COMPLETED" },
        { key: "enableInstallShortcut", label: "Install shortcuts", desc: "Add home screen shortcuts", manifest: "INSTALL_SHORTCUT" },
        { key: "enableSystemAlertWindow", label: "Draw over other apps", desc: "Display overlay windows", level: "danger", manifest: "SYSTEM_ALERT_WINDOW" },
        { key: "enableInstallPackages", label: "Install packages", desc: "Install APK files (dangerous)", level: "danger", manifest: "REQUEST_INSTALL_PACKAGES" },
      ],
    },
    {
      icon: "🔐", name: "Biometric",
      perms: [
        { key: "enableBiometric", label: "Biometric auth", desc: "Face/fingerprint unlock", level: "warn", manifest: "USE_BIOMETRIC", runtime: true },
        { key: "enableFingerprint", label: "Fingerprint", desc: "Legacy fingerprint API", level: "warn", manifest: "USE_FINGERPRINT", runtime: true },
      ],
    },
  ];

  // ────────────────────────────────────────────────────────────────
  // RENDER PERMISSION UI
  // ────────────────────────────────────────────────────────────────
  const permContainer = document.getElementById("permContainer");

  function renderPerms() {
    permContainer.innerHTML = PERMISSION_CATEGORIES.map((cat, ci) => {
      const enabledCount = cat.perms.filter(p => isPermChecked(p.key, p.default)).length;
      const body = cat.perms.map(p => {
        const checked = isPermChecked(p.key, p.default);
        const cls = p.level === "danger" ? "danger" : p.level === "warn" ? "warn" : "";
        return `
          <label class="perm-item ${cls}">
            <input type="checkbox" id="${p.key}" data-default="${p.default ? "1" : "0"}" ${checked ? "checked" : ""} />
            <span class="perm-text">
              <span class="perm-name">${p.label}</span>
              <span class="perm-desc">${p.desc}</span>
            </span>
          </label>`;
      }).join("");
      return `
        <div class="perm-cat ${ci < 3 ? "open" : ""}" data-cat="${ci}">
          <div class="perm-cat-header" onclick="toggleCat(${ci})">
            <span class="title">${cat.icon} ${cat.name}</span>
            <span style="display:flex;align-items:center;gap:8px;">
              <span class="count" id="catCount${ci}">${enabledCount}</span>
              <span class="chev">▶</span>
            </span>
          </div>
          <div class="perm-cat-body">
            <div class="perm-grid">${body}</div>
          </div>
        </div>`;
    }).join("");

    // Attach change listeners to update counts
    permContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener("change", updateCounts);
    });
  }

  function isPermChecked(key, defaultVal) {
    const saved = localStorage.getItem("perm_" + key);
    if (saved === null) return !!defaultVal;
    return saved === "1";
  }

  function updateCounts() {
    PERMISSION_CATEGORIES.forEach((cat, ci) => {
      const count = cat.perms.filter(p => document.getElementById(p.key)?.checked).length;
      const el = document.getElementById("catCount" + ci);
      if (el) el.textContent = count;
    });
    // Save state
    permContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      localStorage.setItem("perm_" + cb.id, cb.checked ? "1" : "0");
    });
  }

  function toggleCat(ci) {
    const el = permContainer.querySelector(`.perm-cat[data-cat="${ci}"]`);
    if (el) el.classList.toggle("open");
  }

  function expandAll() {
    permContainer.querySelectorAll(".perm-cat").forEach(el => el.classList.add("open"));
  }
  function collapseAll() {
    permContainer.querySelectorAll(".perm-cat").forEach(el => el.classList.remove("open"));
  }
  function resetPerms() {
    permContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      const dflt = cb.dataset.default === "1";
      cb.checked = dflt;
      localStorage.setItem("perm_" + cb.id, dflt ? "1" : "0");
    });
    updateCounts();
  }

  renderPerms();

  // ────────────────────────────────────────────────────────────────
  // ICON / COLOR / FORM (same as before)
  // ────────────────────────────────────────────────────────────────
  const form = document.getElementById("buildForm");
  const errorEl = document.getElementById("formError");
  const colorPicker = document.getElementById("themeColor");
  const colorText = document.getElementById("themeColorText");
  const iconFile = document.getElementById("iconFile");
  const iconDrop = document.getElementById("iconDrop");
  const iconImg = document.getElementById("iconPreview");
  const iconWrap = document.getElementById("iconPreviewWrap");
  const iconMeta = document.getElementById("iconPreviewMeta");
  const iconStatus = document.getElementById("iconStatus");

  colorPicker.addEventListener("input", () => colorText.value = colorPicker.value);
  colorText.addEventListener("input", () => { if (/^#[0-9a-fA-F]{6}$/.test(colorText.value)) colorPicker.value = colorText.value; });

  ["dragenter","dragover"].forEach(ev => iconDrop.addEventListener(ev, e => { e.preventDefault(); iconDrop.classList.add("dragover"); }));
  ["dragleave","drop"].forEach(ev => iconDrop.addEventListener(ev, e => { e.preventDefault(); iconDrop.classList.remove("dragover"); }));
  iconDrop.addEventListener("drop", e => {
    const file = e.dataTransfer?.files?.[0];
    if (file) { const dt = new DataTransfer(); dt.items.add(file); iconFile.files = dt.files; iconFile.dispatchEvent(new Event("change", { bubbles: true })); }
  });

  iconFile.addEventListener("change", async () => {
    const file = iconFile.files?.[0];
    if (!file) { resetIcon(); return; }
    if (!file.type.startsWith("image/")) { setStatus("✗ Please select an image file", "err"); iconFile.value = ""; resetIcon(true); return; }
    setStatus("⏳ Processing icon…");
    try {
      const result = await processIcon(file);
      iconImg.src = result.base64; iconImg.dataset.base64 = result.base64;
      iconWrap.classList.add("show");
      const srcKB = Math.round(result.originalBytes / 1024);
      const outKB = Math.round(result.bytes / 1024);
      const ratio = result.originalBytes > 0 ? Math.round((1 - result.bytes / result.originalBytes) * 100) : 0;
      iconMeta.textContent = `${result.width}×${result.height} · ${outKB} KB`;
      setStatus(`✓ Ready — 512×512 PNG, ${outKB} KB (from ${result.originalWidth}×${result.originalHeight} ${srcKB} KB${ratio > 0 ? ` — saved ${ratio}%` : ""})`, "ok");
    } catch (err) {
      resetIcon(); setStatus("✗ " + (err.message || "Failed"), "err"); iconFile.value = "";
    }
  });

  function resetIcon(keep) {
    iconImg.src = ""; iconImg.removeAttribute("data-base64");
    iconWrap.classList.remove("show"); iconMeta.textContent = "";
    if (!keep) setStatus("");
  }
  function setStatus(msg, cls = "") { iconStatus.textContent = msg; iconStatus.className = "icon-status" + (cls ? " " + cls : ""); }

  // ────────────────────────────────────────────────────────────────
  // SUBMIT
  // ────────────────────────────────────────────────────────────────
  const PACKAGE_RE = /^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.innerHTML = "";

    const appName = form.appName.value.trim();
    const websiteUrl = form.websiteUrl.value.trim();
    const packageName = form.packageName.value.trim();
    const versionName = form.versionName.value.trim();
    const versionCode = Number(form.versionCode.value);
    const themeColor = colorText.value;

    if (!appName || appName.length > 50) return showErr("App name must be 1-50 characters");
    if (!/^https:\/\/.+/.test(websiteUrl)) return showErr("Website URL must start with https://");
    if (!PACKAGE_RE.test(packageName)) return showErr("Package name must look like com.example.app");
    if (!/^\d+\.\d+\.\d+/.test(versionName)) return showErr("Version name must be semver");
    if (!Number.isInteger(versionCode) || versionCode < 1) return showErr("Version code must be positive integer");
    if (!/^#[0-9a-fA-F]{6}$/.test(themeColor)) return showErr("Theme color must be #rrggbb");

    // Build payload with all permission flags
    const payload = {
      appName, websiteUrl, packageName, versionName, versionCode, themeColor,
      iconBase64: iconImg.dataset.base64 || null,
      orientation: form.orientation.value,
    };

    // Add every checkbox in permContainer
    permContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      payload[cb.id] = cb.checked;
    });

    const btn = document.getElementById("submitBtn");
    btn.disabled = true; btn.textContent = "Queueing…";

    try {
      const { buildId } = await api.createBuild(payload);
      location.href = `status.html?buildId=${encodeURIComponent(buildId)}`;
    } catch (err) {
      btn.disabled = false; btn.textContent = "Queue build";
      showErr(err.message);
    }
  });

  function showErr(msg) {
    errorEl.innerHTML = `<div class="error-box">${msg}</div>`;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
</script>
</body>
</html>
